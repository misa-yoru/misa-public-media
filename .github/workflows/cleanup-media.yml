name: Cleanup public media

on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "削除せず、対象画像だけを表示する"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: public-media-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Clean release assets
        shell: bash
        run: |
          args=(
            --release-tag instagram-media
            --retention-days 30
            --max-total-mb 500
            --target-total-mb 400
          )
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/cleanup_release_assets.py "${args[@]}"
